<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>请不要删除这条帖子</title>
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/school.css">
<link rel="stylesheet" href="css/forum.css">
</head>
<body>
<div class="win">
  <div class="titlebar">
    <span class="appname">◎ 网页浏览器</span>
    <div class="tabs" id="tabs"></div>
    <span class="winbtn">－ □ ×</span>
  </div>
  <div class="toolbar">
    <button id="back" title="后退">◀</button>
    <button id="fwd" title="前进">▶</button>
    <button id="reload" title="刷新">↻</button>
    <button id="home" title="主页">⌂</button>
    <form id="addr-form" class="addr">
      <span class="page-ico" id="page-ico">▣</span>
      <input id="addr" spellcheck="false" autocomplete="off" aria-label="地址栏">
      <button class="go" type="submit">转到</button>
    </form>
    <div class="websearch">🔍 网页搜索（离线）</div>
  </div>
  <div class="viewport" id="viewport"><div id="page"></div></div>
  <div class="statusbar"><span id="status">完成</span><span>只读镜像 · 本地存档</span></div>
</div>
<div class="taskbar">
  <button id="notes">📒 调查笔记 <b id="count">0</b></button>
  <button id="help">❓ 卡住了？</button>
  <button id="mute">🔊 音效</button>
  <button id="about">ⓘ 试玩说明</button>
  <button id="reset">↺ 重新开始</button>
  <span class="tclock" data-clock="task"></span>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog"><button id="close-dialog" aria-label="关闭">×</button><div id="dialog-content"></div></dialog>
<div id="intro" class="intro" hidden>
  <div class="intro-box">
    <h1>请不要删除这条帖子</h1>
    <p>2026 年 11 月 14 日，深夜。</p>
    <p>母校临川七中的旧论坛将在今晚零点关闭。你是陈默，七年前从这所学校毕业。<br>你打开了学校官网。</p>
    <p class="cw">内容提示：本作涉及校园霸凌与学生离世，表达克制，无惊吓画面。人物、学校、网址均为虚构，请勿与现实对照。</p>
    <button id="start">打开浏览器</button>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/data-school.js"></script>
<script src="js/data-forum.js"></script>
<script src="js/school.js"></script>
<script src="js/forum.js"></script>
<script src="js/story.js"></script>
<script src="js/main.js"></script>
</body>
</html>
